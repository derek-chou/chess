name: Deploy Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      # GitHub Pages 會讓瀏覽器快取 10 分鐘；每次部署改用含 commit 的檔名，強制載入新版遊戲內容
      - name: Cache-bust main pack
        run: |
          cd build/web
          pck="index-${GITHUB_SHA::7}.pck"
          mv index.pck "$pck"
          sed -i "s/\"index.pck\":/\"$pck\":/; s/GODOT_CONFIG = {/GODOT_CONFIG = {\"mainPack\":\"$pck\",/" index.html
          grep -q "\"mainPack\":\"$pck\"" index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
